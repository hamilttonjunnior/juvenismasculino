<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <title>Hub Juvenis Masculino | FC Académicos</title>

  <!-- SEO & WhatsApp Meta Tags (Open Graph) -->
  <meta name="description" content="Central de acesso às ferramentas e informações da equipa de Juvenis Masculino do FC Académicos.">
  <meta property="og:title" content="Hub Juvenis Masculino | FC Académicos">
  <meta property="og:description" content="Acede rápida e facilmente ao plantel, mapas de treino e ferramentas dos Juvenis Masculino.">
  <meta property="og:image" content="logo.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f8f9fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Ícone da Aplicação e Favicon -->
  <link rel="shortcut icon" href="FCA.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="FCA.ico">

  <!-- Fonte Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Variáveis */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-color: #f8f9fa; /* Off-white suave */
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --border-color: #e5e5e5;
      --border-hover: #111111;
      --btn-bg: #18181b;
      --btn-text: #ffffff;
      --btn-hover: #27272a;
      --accent-gray: #f4f4f5;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh; /* Garante altura perfeita em browsers móveis */
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 4vw, 32px) clamp(12px, 3vw, 20px);
      user-select: none; /* Previne seleção acidental ao tocar rápido */
    }

    /* Container Principal Responsivo */
    .hub-container {
      width: 100%;
      max-width: 440px; /* Adapta-se bem de ecrãs pequenos até tablets/desktops */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Cabeçalho & Logo */
    .header {
      margin-bottom: clamp(20px, 5vh, 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .logo-wrapper {
      width: clamp(76px, 20vw, 96px);
      height: clamp(76px, 20vw, 96px);
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
      padding: 8px;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .title {
      font-size: clamp(1.25rem, 5vw, 1.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: clamp(0.75rem, 3vw, 0.85rem);
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Lista de Links */
    .links-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2.5vh, 14px);
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: clamp(14px, 3.5vw, 18px) clamp(14px, 4vw, 20px);
      background-color: var(--card-bg);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: manipulation;
    }

    /* Efeitos de toque para mobile */
    .link-btn:active {
      transform: scale(0.98);
      background-color: #f1f1f1;
    }

    @media (hover: hover) {
      .link-btn:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        background-color: #ffffff;
      }
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: clamp(10px, 3vw, 14px);
      text-align: left;
      min-width: 0; /* Impede quebra de layout com textos longos */
    }

    .btn-icon {
      width: clamp(36px, 10vw, 42px);
      height: clamp(36px, 10vw, 42px);
      border-radius: 12px;
      background-color: var(--accent-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      flex-shrink: 0;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .btn-title {
      font-size: clamp(0.875rem, 3.8vw, 0.95rem);
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-desc {
      font-size: clamp(0.7rem, 3vw, 0.75rem);
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow-icon {
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
      margin-left: 8px;
    }

    @media (hover: hover) {
      .link-btn:hover .arrow-icon {
        transform: translateX(3px);
        color: var(--text-main);
      }
    }

    /* Destaque para o primeiro botão (Estilo Dark) */
    .link-btn.featured {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border-color: var(--btn-bg);
    }

    .link-btn.featured .btn-title {
      color: #ffffff;
    }

    .link-btn.featured .btn-desc {
      color: #a1a1aa;
    }

    .link-btn.featured .btn-icon {
      background-color: #27272a;
      color: #ffffff;
    }

    .link-btn.featured .arrow-icon {
      color: #a1a1aa;
    }

    .link-btn.featured:active {
      background-color: #000000;
    }

    @media (hover: hover) {
      .link-btn.featured:hover {
        background-color: var(--btn-hover);
        border-color: var(--btn-hover);
      }
    }

    /* Rodapé */
    .footer {
      margin-top: clamp(24px, 5vh, 40px);
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <main class="hub-container">

    <!-- Cabeçalho -->
    <header class="header">
      <div class="logo-wrapper">
        <img src="logo.png" alt="FC Académicos Logo" onerror="this.style.display='none'">
      </div>
      <h1 class="title">Juvenis Masculino</h1>
      <p class="subtitle">FC Académicos</p>
    </header>

    <!-- Lista de Links -->
    <nav class="links-container">

      <!-- Link 1: Plantel / Gestão (Destaque) -->
      <a href="https://hamilttonjunnior.github.io/juvenismasculino/pantel.html" class="link-btn featured" target="_blank" rel="noopener">
        <div class="btn-content">
          <div class="btn-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">Plantel Juvenis Masculino</span>
            <span class="btn-desc">Atletas, fichas e gestão da equipa</span>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </a>

      <!-- Link 2: Mapa de Treino -->
      <a href="https://hamilttonjunnior.github.io/juvenismasculino/mapadetreino.html" class="link-btn" target="_blank" rel="noopener">
        <div class="btn-content">
          <div class="btn-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">Mapa de Treino</span>
            <span class="btn-desc">Planificação e estrutura das sessões</span>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </a>

    </nav>

    <!-- Rodapé -->
    <footer class="footer">
      <p>© FC Académicos • Voleibol</p>
    </footer>

  </main>

</body>
</html>
